<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="41.25 13.25 489.48 137.5">
<title>Kubera logo</title>
<desc>Kubera logo — a hexagonal coin mark with layered geometry inspired by CNCF ecosystem tools, alongside the wordmark and tagline.</desc>
<defs>
  <clipPath id="hex-clip">
    <polygon points="100,18 155,50 155,114 100,146 45,114 45,50"/>
  </clipPath>
</defs>

<!-- ICON MARK -->
<polygon points="100,14 158,48 158,116 100,150 42,116 42,48" fill="#0F2744"/>
<polygon points="100,26 146,52 146,112 100,138 54,112 54,52" fill="#1A3A5C"/>
<polygon points="100,40 136,62 136,102 100,124 64,102 64,62" fill="#00B4D8"/>
<polygon points="100,54 120,82 100,110 80,82" fill="#0F2744"/>
<circle cx="100" cy="54" r="4" fill="#E0F7FA"/>
<circle cx="120" cy="82" r="4" fill="#E0F7FA"/>
<circle cx="100" cy="110" r="4" fill="#E0F7FA"/>
<circle cx="80" cy="82" r="4" fill="#E0F7FA"/>
<line x1="100" y1="54" x2="100" y2="110" stroke="#E0F7FA" stroke-width="0.8" opacity="0.35"/>
<line x1="80" y1="82" x2="120" y2="82" stroke="#E0F7FA" stroke-width="0.8" opacity="0.35"/>
<polygon points="100,14 158,48 158,116 100,150 42,116 42,48" fill="none" stroke="#00B4D8" stroke-width="1.5"/>

<!-- WORDMARK -->
<text x="186" y="98" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#0F2744">Kubera</text>
<text x="188" y="128" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.5" fill="#5A7A9A">Know exactly what your cluster costs. And why.</text>
</svg>