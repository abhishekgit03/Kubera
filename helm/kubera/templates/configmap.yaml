apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubera.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
data:
  GEMINI_MODEL: {{ .Values.gemini.model | quote }}
  REFRESH_INTERVAL_SECONDS: {{ .Values.collector.refreshIntervalSeconds | quote }}
  CPU_COST_PER_CORE_HOUR: {{ .Values.pricing.cpuCostPerCoreHour | quote }}
  MEM_COST_PER_GB_HOUR: {{ .Values.pricing.memCostPerGBHour | quote }}
